name: build

on:
  push:
    branches: ['master']
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: ['master']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      additional-gradle-args:
        description: "Additional Gradle arguments to add to the command line"
        required: false
        default: '--info --tests "com.bkahlert.kommons.logging.*"'

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Dfile.encoding=UTF-8 -Xmx3g -XX:MaxMetaspaceSize=756m -XX:+HeapDumpOnOutOfMemoryError"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # JVM: the build always runs on JDK 17; `test-jdk` selects the JDK the tests run on.
          - { os: ubuntu-latest, target: jvm, test-jdk: 17 }
          - { os: ubuntu-latest, target: jvm, test-jdk: 21 }
          - { os: ubuntu-latest, target: jvm, test-jdk: 25 }
          - { os: windows-latest, target: jvm, test-jdk: 17 }
          - { os: macos-latest, target: jvm, test-jdk: 17 }

          - { os: ubuntu-latest, target: js }

          # linuxArm64 has no CI host; the linuxX64 job cross-compiles and links its test binaries without running them.
          - { os: ubuntu-latest, target: linuxX64, extra-tasks: linuxArm64TestBinaries }
          - { os: windows-latest, target: mingwX64 }
          - { os: macos-latest, target: macosArm64 }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The logging stack's suites are excluded until the Spring Boot upgrade: Spring Boot 2.7 has no SLF4J 2
      # support (it needs org.slf4j.impl.StaticLoggerBinder), and Logback 1.3 resolves <include> at parse time,
      # before the <define> elements that compute kommons' appender configuration paths have run.
      - name: Test ${{ matrix.target }}${{ matrix.test-jdk && format(' on JDK {0}', matrix.test-jdk) || '' }}
        shell: bash
        run: >
          ./gradlew ${{ matrix.target }}Test
          ${{ matrix.target == 'jvm' && 'test' || '' }}
          -x :kommons-logging:kommons-logging-logback:jvmTest
          -x :kommons-logging:kommons-logging-spring-boot:jvmTest
          -x :kommons-logging:kommons-logging-spring-boot-sample:test
          ${{ matrix.extra-tasks || '' }}
          ${{ matrix.test-jdk && format('-PtestJdk={0}', matrix.test-jdk) || '' }}
          -Pkotlin.tests.individualTaskReports=true
          ${{ github.event.inputs.additional-gradle-args }}

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-reports--os-${{ matrix.os }}--target-${{ matrix.target }}--java-${{ matrix.test-jdk || 17 }}
          if-no-files-found: error
          path: ./**/build/test-results/**/*.xml
